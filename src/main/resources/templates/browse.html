<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--@thymesVar id="model" type="org.softwire.training.bookish.models.page.AboutPageModel"-->

<head>
    <title>Bookish - About Us</title>

    <link rel="stylesheet" href="/styles/general.css"/>
    <link rel="stylesheet" href="/styles/navbar.css"/>
    <link rel="stylesheet" href="/styles/about.css"/>
    <link rel="stylesheet" href="/styles/catalog.css"/>
    <script>
        function sortBooks(books, sort) {
            switch(sort){
                case 'title':
                    books.sort((a,b) => a.title.localeCompare(b.title));
                    break;
                case 'author':
                    books.sort((a,b) => a.author.localeCompare(b.author));
                    break;
                default:
                    books.sort((a,b) => a.title.localeCompare(b.title));
            }
            return books;
        }
    </script>
    <script th:inline="javascript">
        function sortBooksByTitle() {
            let books = [[${model.books}]];
            books.sort((a,b) => a.title.localeCompare(b.title));
        }
    </script>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}">
    <!-- This element is replaced by the HTML in fragments/navbar.html -->
</div>

<div class="container">

        <table class ="book-list">
            <tr>
                <th><button type="button" th:onclick="sortBooksByTitle()">Title</button></th>
                <th><a href="?sort=author">Author</a></th>
                <th><a href="?sort=isbn">ISBN</a></th>
                <th><a href="?sort=edition">Edition</a></th>
                <th><a href="?sort=publisher">Publisher</a></th>
                <th>Num Copies</th>
            </tr>
            <tr th:each="book : ${model.books}">
                <td th:text="${book.title}" />
                <td th:text="${book.author}" />
                <td th:text="${book.ISBN}" />
                <td th:text="${book.edition}" />
                <td th:text="${book.publisher}" />
                <td th:text="${book.copies.size()}" />
                <td><a th:href="${'/about'}" class="delete-button">delete</a></td>
            </tr>
        </table>


    <h2>Add a book:</h2>
    <form th:action="@{/about/add-technology}" method="post">
        <div class="add-tech-row">
            <label>
                <span>Name: </span>
                <input type="text" name="name">
            </label>
        </div>
        <div class="add-tech-row">
            <label>
                <span>Logo URL: </span>
                <input type="text" name="logoUrl">
            </label>
        </div>
        <div class="add-tech-row">
            <span><!-- spacer --></span>
            <input type="submit" value="Add technology" />
        </div>
    </form>
</div>

</body>


</html>
